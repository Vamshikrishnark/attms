  <!-- Simplified mesh inside -->
  <!-- Top row -->
  <circle cx="22" cy="18" r="2.5" fill="white" opacity="0.4"/>
  <circle cx="32" cy="18" r="2.5" fill="white" opacity="0.4"/>
  <circle cx="42" cy="18" r="2.5" fill="white" opacity="0.4"/>

  <!-- Middle -->
  <circle cx="32" cy="32" r="3" fill="white"/>

  <!-- Bottom row -->
  <circle cx="20" cy="45" r="2.5" fill="white" opacity="0.4"/>
  <circle cx="32" cy="45" r="2.5" fill="white" opacity="0.4"/>
  <circle cx="44" cy="45" r="2.5" fill="white" opacity="0.4"/>

  <!-- Minimal connections -->
  <line x1="22" y1="18" x2="32" y2="32" stroke="white" stroke-width="0.8" opacity="0.3"/>
  <line x1="42" y1="18" x2="32" y2="32" stroke="white" stroke-width="0.8" opacity="0.3"/>
  <line x1="32" y1="32" x2="20" y2="45" stroke="white" stroke-width="0.8" opacity="0.3"/>
  <line x1="32" y1="32" x2="44" y2="45" stroke="white" stroke-width="0.8" opacity="0.3"/>
</svg>