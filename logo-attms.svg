<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Hexagon border -->
  <path d="M 100 20 L 160 55 L 160 145 L 100 180 L 40 145 L 40 55 Z"
        fill="none" stroke="#0891B2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Top row - 3 circles (API, HTTP, UI) -->
  <circle cx="60" cy="50" r="8" fill="#0891B2" opacity="0.3"/>
  <circle cx="100" cy="50" r="8" fill="#0891B2" opacity="0.3"/>
  <circle cx="140" cy="50" r="8" fill="#0891B2" opacity="0.3"/>

  <!-- Top connections -->
  <line x1="60" y1="50" x2="100" y2="50" stroke="#0891B2" stroke-width="1.5" opacity="0.5"/>
  <line x1="100" y1="50" x2="140" y2="50" stroke="#0891B2" stroke-width="1.5" opacity="0.5"/>

  <!-- Middle row - Center dispatcher -->
  <circle cx="60" cy="100" r="8" fill="#0891B2" opacity="0.2"/>
  <circle cx="100" cy="100" r="10" fill="#0891B2"/>
  <circle cx="140" cy="100" r="8" fill="#0891B2" opacity="0.2"/>

  <!-- Middle connections -->
  <line x1="60" y1="100" x2="90" y2="100" stroke="#0891B2" stroke-width="1.5"/>
  <line x1="110" y1="100" x2="140" y2="100" stroke="#0891B2" stroke-width="1.5"/>
  <line x1="60" y1="50" x2="60" y2="100" stroke="#0891B2" stroke-width="1.5" opacity="0.5"/>
  <line x1="140" y1="50" x2="140" y2="100" stroke="#0891B2" stroke-width="1.5" opacity="0.5"/>

  <!-- Bottom row - 4 agent nodes -->
  <circle cx="45" cy="150" r="8" fill="#0891B2" opacity="0.3"/>
  <circle cx="75" cy="150" r="8" fill="#0891B2" opacity="0.3"/>
  <circle cx="125" cy="150" r="8" fill="#0891B2" opacity="0.3"/>
  <circle cx="155" cy="150" r="8" fill="#0891B2" opacity="0.3"/>

  <!-- Bottom connections -->
  <line x1="45" y1="150" x2="75" y2="150" stroke="#0891B2" stroke-width="1.5" opacity="0.5"/>
  <line x1="75" y1="150" x2="125" y2="150" stroke="#0891B2" stroke-width="1.5" opacity="0.5"/>
  <line x1="125" y1="150" x2="155" y2="150" stroke="#0891B2" stroke-width="1.5" opacity="0.5"/>

  <!-- Hub to agents connections -->
  <line x1="80" y1="105" x2="45" y2="150" stroke="#0891B2" stroke-width="1.5" opacity="0.4"/>
  <line x1="90" y1="108" x2="75" y2="150" stroke="#0891B2" stroke-width="1.5" opacity="0.4"/>
  <line x1="110" y1="108" x2="125" y2="150" stroke="#0891B2" stroke-width="1.5" opacity="0.4"/>
  <line x1="120" y1="105" x2="155" y2="150" stroke="#0891B2" stroke-width="1.5" opacity="0.4"/>
</svg>